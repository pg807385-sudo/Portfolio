name: Unzip Portfolio

on:
  workflow_dispatch:
  push:
    paths:
      - "prince-portfolio-dynamic.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip portfolio
        run: |
          unzip -o prince-portfolio-dynamic.zip -d extracted
          cp -r extracted/* .
          rm -rf extracted
          rm -f prince-portfolio-dynamic.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Extract portfolio ZIP"
          git push
